version: "3.9"

services:
  # Service : base de données
  mariadb:
    image: mariadb:10.11
    restart: unless-stopped
    command: ["mariadbd", "--event-scheduler=ON"]
    environment:
      MARIADB_ROOT_PASSWORD: rootpassword
      MARIADB_DATABASE: Marais_R_Site
      MARIADB_USER: Marais_R_Site_User
      MARIADB_PASSWORD: Marais_R_Site_User/123
    volumes:
      - vol_BDD:/var/lib/mysql
    networks:
      - marais_net

  # phpMyAdmin pour gérer la BDD facilement
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    environment:
      PMA_HOST: mariadb
      PMA_ARBITRARY: 1
    depends_on:
      - mariadb
    networks:
      - marais_net

  # Grafana pour les graphiques 
  grafana:
    image: grafana/grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - vol_grafana:/var/lib/grafana
    networks:
      - marais_net

  # Mosquitto pour la communication MQTT
  mosquitto:
    image: eclipse-mosquitto:2.0
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
      - ./mosquitto/config:/mosquitto/config
    networks:
      - marais_net

  # MON service (ton application Flask)
  web:
    build: .
    ports:
      - "5000:5000"
    volumes:
      - ./static:/app/static
    environment:
      - DB_HOST=mariadb
      - DB_USER=root
      - DB_PASSWORD=rootpassword
      - DB_NAME=Marais_R_Site
    depends_on:
      - mariadb
    networks:
      - marais_net

volumes:
  vol_BDD:
  vol_grafana:
  mosquitto_data:
  mosquitto_log:

networks:
  marais_net:
    driver: bridge